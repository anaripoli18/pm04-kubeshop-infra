---
- name: Aguardar inicializacao das VMs
  hosts: all
  gather_facts: false

  tasks:
    - name: Aguardar conclusao do cloud-init
      ansible.builtin.raw: cloud-init status --wait
      changed_when: false

- name: Preparar servidores KubeShop
  hosts: all
  become: true
  gather_facts: true

  roles:
    - os_updates
    - docker

- name: Preparar disco persistente do MongoDB
  hosts: database
  become: true
  gather_facts: true

  roles:
    - ebs_mount

- name: Configurar MongoDB
  hosts: database
  become: true
  gather_facts: true

  roles:
    - mongodb

- name: Configurar aplicacao
  hosts: application
  become: true
  gather_facts: true

  roles:
    - application
